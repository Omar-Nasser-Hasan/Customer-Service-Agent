[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-customer-service"
version = "0.4.0"
description = "Iteration 4 WhatsApp customer-service agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "langchain>=1,<2",
    "langchain-google-genai>=3,<4",
    "langgraph==1.2.12",
    "langgraph-checkpoint==4.2.0",
    "langgraph-checkpoint-postgres==3.1.2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<1",
    "testcontainers[postgres]>=4.9,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: requires an isolated Docker Postgres container",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
customer_service = ["data/*.json"]
