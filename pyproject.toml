[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-customer-service"
version = "0.3.0"
description = "Iteration 3 WhatsApp customer-service agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "langchain>=1,<2",
    "langchain-google-genai>=3,<4",
    "langgraph>=1,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
customer_service = ["data/*.json"]
