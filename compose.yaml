services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: customer_service
      POSTGRES_USER: customer_service
      POSTGRES_PASSWORD: customer_service
    ports:
      - "5432:5432"
    volumes:
      - customer_service_postgres:/var/lib/postgresql/data
  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql://customer_service:customer_service@postgres:5432/customer_service
    ports:
      - "8000:8000"
    depends_on:
      - postgres
  worker:
    build: .
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql://customer_service:customer_service@postgres:5432/customer_service
    command: ["python", "-m", "customer_service.worker.run"]
    depends_on:
      - postgres
  admin:
    build:
      context: ./apps/admin
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  customer_service_postgres:
